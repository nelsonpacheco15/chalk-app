<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">

<body>
  <main id="view" class="view"></main>

    <button class="tab" data-tab="fuel">

      <span>Food</span>
    </button>
    <button class="tab" data-tab="skills">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4v-5h4v-5h4V5h4"/></svg>
      <span>Skills</span>
    </button>
    <button class="tab" data-tab="me">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1.2-3.6 3.8-5.5 7-5.5s5.8 1.9 7 5.5"/></svg>
      <span>Me</span>
    </button>
  </nav>

  <script src="program.js?v=15"></script>
  <script src="skills.js?v=15"></script>
  <script src="app.js?v=15"></script>

</html>
